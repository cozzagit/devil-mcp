  <text x="168" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f6f0e9">Devi<tspan fill="#ff6a3d">L</tspan></text>
  <text x="169" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#9a8e82">per Claude Code · server MCP</text>

  <text x="80" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#f6f0e9">Il tuo miglior commerciale è</text>
  <text x="80" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="url(#accent)">il codice che hai già scritto.</text>
  <text x="80" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#c9bdb0">Trova PMI italiane che potrebbero averne bisogno, con le prove e tre indici separati.</text>

  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15">
    <rect x="880" y="96" width="320" height="168" rx="14" fill="#171310" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="904" cy="118" r="5" fill="#ff6a3d"/><circle cx="922" cy="118" r="5" fill="#fbbf24" fill-opacity="0.8"/><circle cx="940" cy="118" r="5" fill="#4ade80" fill-opacity="0.7"/>
    <text x="900" y="156" fill="#ff9a6e">›</text><text x="916" y="156" fill="#f6f0e9">trova imprese edili</text>
    <text x="916" y="178" fill="#f6f0e9">a Bergamo per il mio</text>
    <text x="916" y="200" fill="#f6f0e9">gestionale cantieri</text>
    <text x="900" y="236" fill="#4ade80">✓</text><text x="916" y="236" fill="#9a8e82">3 pronte · 2 da verificare</text>
