    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <g transform="translate(80 72) scale(1.5)">
    <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#mark)"/>
    <path d="M11 17.6 C10.3 13.6 9.3 10.6 7.4 8 C11.6 10 14.7 13.4 16.6 17.6 Z" fill="#fff"/>
    <path d="M23.4 17.3 C25.6 13.4 28.7 10.3 32.9 8.4 C31 11.1 29.8 14.2 29.4 18.4 Z" fill="#fff"/>
    <path d="M11 17 H21 C28.7 17 33.5 21.9 33.5 28 C33.5 34.1 28.7 39 21 39 H11 Z M16.5 22 V34 H20.8 C25.3 34 27.8 31.6 27.8 28 C27.8 24.4 25.3 22 20.8 22 Z" fill="#fff" fill-rule="evenodd"/>
    <path d="M30.2 36.4 C35.9 36.7 39.3 33 39.5 26.6" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M39.6 19.6 L43.2 26.9 L36 26.7 Z" fill="#fff" stroke="#fff" stroke-width="0.8" stroke-linejoin="round"/>
