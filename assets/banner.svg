<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="DeviL per Claude Code: il tuo miglior commerciale è il codice che hai già scritto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#110e0c"/>
      <stop offset="1" stop-color="#1c130f"/>
    </linearGradient>
    <radialGradient id="glow" cx="1080" cy="40" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="4" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="0.5" stop-color="#ec4a24"/>
      <stop offset="1" stop-color="#b3221a"/>
    </linearGradient>
